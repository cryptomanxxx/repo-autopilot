name: OpenCode coding agent (Blablador)

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Coding task for OpenCode (creates a PR; never merges)"
        required: true
        type: string

concurrency:
  group: opencode-${{ github.repository }}
  cancel-in-progress: false

jobs:
  lease:
    # This initial backend supports owner-operated personal repositories only.
    # An Actions repository variable is not a safe authorization boundary.
    if: github.event.repository.owner.type == 'User' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Configure a protected environment with required owner reviewers and
    # deployment branches limited to the default branch before running.
    # The gateway only issues leases to this environment's OIDC identity.
    environment: ai-agent-production
    permissions:
      # Only to prove this run's identity to the AI gateway. No provider key
      # is ever stored in GitHub; it lives in the gateway's Cloudflare secrets.
      # This job runs no repository or agent code, so nothing untrusted can
      # reach the OIDC token request credentials.
      id-token: write
    outputs:
      gateway_url: ${{ steps.exchange.outputs.gateway_url }}
    steps:
      - name: Exchange GitHub OIDC for a short-lived gateway lease
        id: exchange
        env:
          AI_GATEWAY_URL: ${{ vars.AI_GATEWAY_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$AI_GATEWAY_URL" =~ ^https://[A-Za-z0-9.-]+$ ]]; then
            echo "::error::Set the AI_GATEWAY_URL variable on the ai-agent-production environment (https origin, no path)."
            exit 1
          fi
          jwt="$(curl -sSf --max-time 30 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=repo-autopilot-ai-gateway" | jq -er .value)"
          echo "::add-mask::$jwt"
          lease="$(curl -sSf --max-time 30 --proto '=https' -X POST \
            -H "Authorization: Bearer $jwt" \
            "$AI_GATEWAY_URL/v1/session" | jq -er .access_token)"
          if [[ ! "$lease" =~ ^g1\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]{43}$ ]]; then
            echo "::error::Gateway returned an unexpected lease format."
            exit 1
          fi
          echo "::add-mask::$lease"
          # Handed over as a file, never as a job output or env value, which
          # GitHub would print in the next job's log. Valid 30 min / 100 calls.
          mkdir -p "$RUNNER_TEMP/lease"
          umask 077
          printf '%s' "$lease" > "$RUNNER_TEMP/lease/gateway-lease"
          echo "gateway_url=$AI_GATEWAY_URL" >> "$GITHUB_OUTPUT"

      - name: Hand the lease to the agent job
        uses: actions/upload-artifact@v4
        with:
          name: gateway-lease
          path: ${{ runner.temp }}/lease/gateway-lease
          if-no-files-found: error
          retention-days: 1

  propose:
    needs: lease
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # No id-token permission and no environment: agent-controlled code
    # (OpenCode, npm scripts, tests) runs only in this job.
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    env:
      TASK: ${{ inputs.task }}
    steps:
      - name: Receive the gateway lease
        uses: actions/download-artifact@v4
        with:
          name: gateway-lease
          path: ${{ runner.temp }}

      - name: Mask the gateway lease
        shell: bash
        run: |
          set -euo pipefail
          chmod 600 "$RUNNER_TEMP/gateway-lease"
          echo "::add-mask::$(cat "$RUNNER_TEMP/gateway-lease")"

      - name: Checkout default branch without stored credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Capture the actual checkout commit
        shell: bash
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/opencode-base.sha"
          echo "OPENCODE_BASE_SHA=$(cat "$RUNNER_TEMP/opencode-base.sha")" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TASK" || ${#TASK} -gt 4000 ]]; then
            echo "::error::Task must be between 1 and 4000 characters."
            exit 1
          fi

      - name: Install pinned OpenCode
        run: npm install --global opencode-ai@1.19.3

      - name: Configure OpenCode for the AI gateway
        env:
          AI_GATEWAY_URL: ${{ needs.lease.outputs.gateway_url }}
        shell: bash
        run: |
          mkdir -p "$HOME/.config/opencode"
          cat > "$HOME/.config/opencode/opencode.json" <<JSON
          {
            "\$schema": "https://opencode.ai/config.json",
            "model": "blablador/alias-code",
            "small_model": "blablador/alias-fast",
            "provider": {
              "blablador": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "Helmholtz Blablador",
                "options": {
                  "baseURL": "${AI_GATEWAY_URL}/v1",
                  "apiKey": "{env:AI_GATEWAY_LEASE}"
                },
                "models": {
                  "alias-code": {
                    "name": "Blablador Code",
                    "limit": {"context": 98304, "output": 8192}
                  },
                  "alias-fast": {
                    "name": "Blablador Fast",
                    "limit": {"context": 98304, "output": 8192}
                  }
                }
              }
            }
          }
          JSON
          chmod 600 "$HOME/.config/opencode/opencode.json"

      - name: Run unprivileged coding agent
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/opencode-task.txt" <<'TXT'
          You are working in Repo Autopilot. Implement the user's coding request in this checked-out repository. Do not create local commits, merge, push, create a pull request, modify GitHub workflow files, touch credentials or alter security-sensitive configuration. Do not run remote scripts. Prefer minimal changes. The enclosing workflow validates, tests and opens a PR for human review.
          TXT
          printf '\nUser request:\n%s\n' "$TASK" >> "$RUNNER_TEMP/opencode-task.txt"
          # The agent sees only the expiring gateway lease, never a provider key.
          AI_GATEWAY_LEASE="$(cat "$RUNNER_TEMP/gateway-lease")" \
            opencode run --model blablador/alias-code "$(cat "$RUNNER_TEMP/opencode-task.txt")"
          rm -f "$RUNNER_TEMP/gateway-lease"

      - name: Test edits and create an untrusted patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          # A local agent commit is not silently ignored: reset HEAD while
          # retaining the edited worktree against the actual checked-out base.
          git reset --mixed "$OPENCODE_BASE_SHA"
          git add -A
          if git diff --cached --quiet "$OPENCODE_BASE_SHA"; then
            echo "::notice::OpenCode made no changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm run check
          npm test
          # Tests may create more files. Stage the final result and validate it.
          git add -A
          while IFS= read -r -d '' path; do
            if [[ "$path" == .* || "$path" == */.* ||
                  "$path" == *secret* || "$path" == *credential* ||
                  "$path" == *private.key* ]]; then
              echo "::error::Protected path changed: $path"
              exit 1
            fi
            mode="$(git ls-files --stage -- "$path" | cut -d' ' -f1)"
            if [[ -n "$mode" && "$mode" != 100644 && "$mode" != 100755 ]]; then
              echo "::error::Unexpected file type in proposal: $path"
              exit 1
            fi
          done < <(git diff --cached --name-only --no-renames -z "$OPENCODE_BASE_SHA")
          git diff --cached --check "$OPENCODE_BASE_SHA"
          git diff --cached --binary --no-ext-diff "$OPENCODE_BASE_SHA" > "$RUNNER_TEMP/opencode.patch"
          if [[ ! -s "$RUNNER_TEMP/opencode.patch" || $(stat -c %s "$RUNNER_TEMP/opencode.patch") -gt 1000000 ]]; then
            echo "::error::Invalid or oversized patch."
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload untrusted patch for isolated publisher
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: opencode-proposal
          path: |
            ${{ runner.temp }}/opencode-base.sha
            ${{ runner.temp }}/opencode.patch
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: propose
    if: needs.propose.result == 'success' && needs.propose.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Clean checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download untrusted proposal
        uses: actions/download-artifact@v4
        with:
          name: opencode-proposal
          path: ${{ runner.temp }}/proposal

      - name: Independently validate and apply proposed patch
        shell: bash
        run: |
          set -euo pipefail
          proposal="$RUNNER_TEMP/proposal"
          base="$(cat "$proposal/opencode-base.sha")"
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ || "$base" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::Default branch moved since the agent checkout; rerun on the new base."
            exit 1
          fi
          patch="$proposal/opencode.patch"
          if [[ ! -s "$patch" || $(stat -c %s "$patch") -gt 1000000 ]]; then
            echo "::error::Patch missing or oversized."
            exit 1
          fi
          git apply --index --check "$patch"
          git apply --index "$patch"
          # Never trust path checks or tests from the unprivileged job alone.
          # --no-renames exposes both the source and destination of a rename.
          while IFS= read -r -d '' path; do
            if [[ "$path" == .* || "$path" == */.* ||
                  "$path" == *secret* || "$path" == *credential* ||
                  "$path" == *private.key* ]]; then
              echo "::error::Protected path changed: $path"
              exit 1
            fi
            mode="$(git ls-files --stage -- "$path" | cut -d' ' -f1)"
            if [[ -n "$mode" && "$mode" != 100644 && "$mode" != 100755 ]]; then
              echo "::error::Unexpected file type in proposal: $path"
              exit 1
            fi
          done < <(git diff --cached --name-only --no-renames -z)
          git diff --cached --check
          # Reject anything shaped like a gateway lease (g1.<payload>.<hmac>),
          # so a leaked credential never reaches repository history.
          # Scans every staged blob, binary files included, without a pipe.
          if git grep --cached -a -q -E 'g1\.[A-Za-z0-9_-]{30,400}\.[A-Za-z0-9_-]{43}'; then
            echo "::error::Proposal contains a gateway lease token."
            exit 1
          fi
          total=0
          while IFS= read -r -d '' path; do
            size="$(git cat-file -s ":$path")"
            if (( size > 1048576 )); then
              echo "::error::Staged file exceeds 1 MiB: $path"
              exit 1
            fi
            total=$((total + size))
            if (( total > 5242880 )); then
              echo "::error::Total staged output exceeds 5 MiB."
              exit 1
            fi
          done < <(git diff --cached --diff-filter=ACMT --name-only --no-renames -z)
          if git diff --cached --quiet; then
            echo "::error::Patch made no changes."
            exit 1
          fi

      - name: Create PR using token in isolated job only
        env:
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ inputs.task }}
        shell: bash
        run: |
          set -euo pipefail
          branch="autopilot/opencode-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "feat: implement OpenCode agent task"
          gh auth setup-git
          git push origin "$branch"
          printf '%s\n\n%s\n\n%s\n' \
            'Created by OpenCode with Helmholtz Blablador using separate unprivileged and publishing GitHub Actions jobs.' \
            "Requested task: $TASK" \
            'Validated and tested in the agent job; patch paths independently verified in this fresh publishing job. Human review required; no automatic merge.' > "$RUNNER_TEMP/pr-body.txt"
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" --title "OpenCode: proposed coding change" --body-file "$RUNNER_TEMP/pr-body.txt"

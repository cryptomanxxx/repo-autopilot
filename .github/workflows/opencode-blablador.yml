name: OpenCode coding agent (Blablador)

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Coding task for OpenCode (creates a PR; never merges)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: opencode-${{ github.repository }}
  cancel-in-progress: false

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: github.actor == (vars.AUTOPILOT_TASK_USER != '' && vars.AUTOPILOT_TASK_USER || github.repository_owner)
    env:
      TASK: ${{ inputs.task }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check prerequisites
        env:
          BLABLADOR_API_KEY: ${{ secrets.BLABLADOR_API_KEY }}
        shell: bash
        run: |
          if [[ -z "$BLABLADOR_API_KEY" ]]; then
            echo "::error::Set the BLABLADOR_API_KEY repository Actions secret before running this workflow."
            exit 1
          fi
          if [[ -z "$TASK" || ${#TASK} -gt 4000 ]]; then
            echo "::error::Task must be between 1 and 4000 characters."
            exit 1
          fi

      - name: Install OpenCode
        run: npm install --global opencode-ai@1.19.3

      - name: Configure OpenCode for Blablador
        shell: bash
        run: |
          mkdir -p "$HOME/.config/opencode"
          cat > "$HOME/.config/opencode/opencode.json" <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "blablador/alias-code",
            "small_model": "blablador/alias-fast",
            "provider": {
              "blablador": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "Helmholtz Blablador",
                "options": {
                  "baseURL": "https://api.blablador.fz-juelich.de/v1",
                  "apiKey": "{env:BLABLADOR_API_KEY}"
                },
                "models": {
                  "alias-code": {
                    "name": "Blablador Code",
                    "limit": {"context": 98304, "output": 32768}
                  },
                  "alias-fast": {
                    "name": "Blablador Fast",
                    "limit": {"context": 98304, "output": 32768}
                  }
                }
              }
            }
          }
          JSON
          chmod 600 "$HOME/.config/opencode/opencode.json"

      - name: Run coding agent
        env:
          BLABLADOR_API_KEY: ${{ secrets.BLABLADOR_API_KEY }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/opencode-task.txt" <<'TXT'
          You are working in Repo Autopilot. Implement the user's coding request in this checked-out repository. Do not create local commits, merge, push, create a pull request, change GitHub workflow files, touch credentials or modify security-sensitive configuration. Do not run remote scripts. Prefer a minimal scoped change. The enclosing GitHub Actions job will run tests and open a pull request for human review.
          TXT
          printf '\nUser request:\n%s\n' "$TASK" >> "$RUNNER_TEMP/opencode-task.txt"
          opencode run --model blablador/alias-code "$(cat "$RUNNER_TEMP/opencode-task.txt")"

      - name: Validate changed files and tests
        shell: bash
        run: |
          set -euo pipefail
          # Restore the original checkout HEAD if the agent committed locally.
          # This preserves tracked edits while avoiding unreviewed parent commits.
          base="${{ github.sha }}"
          git reset --mixed "$base"
          if [[ -z "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "::notice::OpenCode made no changes; no PR will be created."
            echo "changed=false" >> "$GITHUB_ENV"
            exit 0
          fi
          npm run check
          npm test
          # Stage only after tests, then validate every staged path including both
          # sides of renames ( --no-renames ) and generated files from test scripts.
          git add -A
          while IFS= read -r -d '' path; do
            if [[ "$path" == .github/* || "$path" == .git/* ||
                  "$path" == .env* || "$path" == */.env* ||
                  "$path" == .npmrc || "$path" == */.npmrc ||
                  "$path" == *secret* || "$path" == *credential* ||
                  "$path" == *private.key* ]]; then
              echo "::error::Protected path changed: $path"
              exit 1
            fi
          done < <(git diff --cached --name-only --no-renames -z "$base")
          if git diff --cached --quiet "$base"; then
            echo "changed=false" >> "$GITHUB_ENV"
          else
            echo "changed=true" >> "$GITHUB_ENV"
          fi

      - name: Push branch and open pull request
        if: env.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="autopilot/opencode-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -m "feat: implement OpenCode agent task"
          git -c http.extraheader="AUTHORIZATION: basic $(printf "x-access-token:%s" "$GH_TOKEN" | base64 -w0)" push origin "$branch"
          printf '%s\n\n%s\n\n%s\n'             'Created by OpenCode with Helmholtz Blablador via a manually triggered GitHub Actions run.'             "Requested task: $TASK"             'Tests: npm run check and npm test. Human review required; no automatic merge.' > "$RUNNER_TEMP/pr-body.txt"
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" --title "OpenCode: proposed coding change" --body-file "$RUNNER_TEMP/pr-body.txt"

name: Test Groq API key

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/groq-test.yml'

permissions: {}

jobs:
  authenticate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify Groq authentication and model generation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        shell: python
        run: |
          import json
          import os
          import sys
          import urllib.request
          import urllib.error

          key = os.environ.get("GROQ_API_KEY", "").strip()
          if not key:
              sys.exit("GROQ_API_KEY is missing or empty.")
          request = urllib.request.Request(
              "https://api.groq.com/openai/v1/models",
              headers={"Authorization": "Bearer " + key, "Accept": "application/json", "User-Agent": "repo-autopilot-groq-test/0.1"},
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              if not isinstance(payload, dict) or not isinstance(payload.get("data"), list):
                  sys.exit("Groq returned an unexpected response.")
          except urllib.error.HTTPError as error:
              sys.exit("Groq authentication test failed (HTTP " + str(error.code) + ").")
          except (urllib.error.URLError, TimeoutError, ValueError):
              sys.exit("Groq connection test failed.")
          if not any(model.get("id") == "openai/gpt-oss-120b" for model in payload["data"]):
              sys.exit("GPT-OSS 120B is unavailable for this Groq key.")
          request = urllib.request.Request(
              "https://api.groq.com/openai/v1/chat/completions",
              data=json.dumps({
                  "model": "openai/gpt-oss-120b",
                  "reasoning_effort": "low",
                  "max_completion_tokens": 512,
                  "response_format": {"type": "json_object"},
                  "messages": [{"role": "user", "content": 'Return JSON {"ok":true}.'}],
              }).encode("utf-8"),
              headers={"Authorization": "Bearer " + key, "Content-Type": "application/json", "User-Agent": "repo-autopilot-groq-test/0.1"},
          )
          try:
              with urllib.request.urlopen(request, timeout=45) as response:
                  result = json.load(response)
              content = result["choices"][0]["message"]["content"]
              if json.loads(content).get("ok") is not True:
                  sys.exit("Groq generation returned an unexpected result.")
          except urllib.error.HTTPError as error:
              sys.exit("Groq generation test failed (HTTP " + str(error.code) + ").")
          except (urllib.error.URLError, TimeoutError, ValueError, KeyError, IndexError, TypeError):
              sys.exit("Groq generation test failed.")
          print("Groq authentication and GPT-OSS 120B JSON generation succeeded.")

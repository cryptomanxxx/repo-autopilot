name: Autopilot task agent
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
permissions: {}
concurrency:
  group: autopilot-task-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  task:
    if: >-
      github.event.issue.user.login == (vars.AUTOPILOT_TASK_USER || github.repository_owner) &&
      github.actor == (vars.AUTOPILOT_TASK_USER || github.repository_owner) &&
      startsWith(github.event.issue.title, 'Autopilot task: ') &&
      startsWith(github.event.issue.body, '<!-- repo-autopilot-task -->') &&
      !github.event.issue.pull_request &&
      (github.event_name == 'issues' || startsWith(github.event.comment.body, '<!-- repo-autopilot-reply -->'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Optional GitHub App (variable AUTOPILOT_APP_ID + secret AUTOPILOT_APP_PRIVATE_KEY): a one-hour
      # installation token scoped to this repository lets the agent open the PR itself, which triggers CI.
      # If the app is not configured or the token cannot be created, the agent falls back to a compare link.
      - id: app-token
        if: vars.AUTOPILOT_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}
      # Trusted worker uses REST only. Generated code is never executed here.
      - run: node scripts/run-agent.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTOPILOT_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          AUTOPILOT_TASK_USER: ${{ vars.AUTOPILOT_TASK_USER || github.repository_owner }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}

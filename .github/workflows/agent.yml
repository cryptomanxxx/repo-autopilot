name: Autopilot task agent
on:
  issues:
    types: [opened]
permissions: {}
concurrency:
  group: autopilot-task-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  task:
    if: github.event.issue.user.login == github.repository_owner && github.actor == github.repository_owner && startsWith(github.event.issue.title, 'Autopilot task: ') && startsWith(github.event.issue.body, '<!-- repo-autopilot-task -->')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Trusted worker uses REST only. Generated code is never executed here.
      - run: node scripts/run-agent.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}

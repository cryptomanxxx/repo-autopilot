name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Pull requests opened by a workflow with GITHUB_TOKEN (Model ratings) do not trigger
  # pull_request runs, so that workflow starts this one on its branch instead.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test

name: Agent chat Worker
on:
  push:
    branches: [main]
    paths: ['worker/**', 'src/agent.js', 'src/github.js', 'src/codex.js', 'src/progress.js', '.github/workflows/chat-worker.yml']
  pull_request:
    paths: ['worker/**', 'src/agent.js', 'src/github.js', 'src/codex.js', 'src/progress.js', '.github/workflows/chat-worker.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chat-worker-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false
env:
  WRANGLER_VERSION: 4.149.0
jobs:
  # Bundles the Worker exactly as a deployment would, without credentials.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npx --yes wrangler@${WRANGLER_VERSION} deploy --dry-run --outdir "$RUNNER_TEMP/worker" --config worker/wrangler.jsonc
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - id: config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLIENT_ID: ${{ vars.AUTOPILOT_CHAT_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AUTOPILOT_CHAT_CLIENT_SECRET }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "::notice::Agent chat is not deployed: set CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and AUTOPILOT_CHAT_CLIENT_SECRET secrets and the AUTOPILOT_CHAT_CLIENT_ID variable (see README)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          # Deploy exactly the commit the build job tested.
          ref: ${{ github.sha }}
          persist-credentials: false
      - if: steps.config.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.config.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ vars.AUTOPILOT_TASK_USER || github.repository_owner }}
          CLIENT_ID: ${{ vars.AUTOPILOT_CHAT_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AUTOPILOT_CHAT_CLIENT_SECRET }}
          MODEL_API_KEY: ${{ secrets.AUTOPILOT_CHAT_MODEL_API_KEY }}
          WEBHOOK_SECRET: ${{ secrets.AUTOPILOT_WEBHOOK_SECRET }}
          MODEL: ${{ vars.AUTOPILOT_CHAT_MODEL }}
          MODEL_PROVIDER: ${{ vars.AUTOPILOT_CHAT_MODEL_PROVIDER }}
          MODEL_BASE_URL: ${{ vars.AUTOPILOT_CHAT_MODEL_BASE_URL }}
          CONTEXT_CHARS: ${{ vars.AUTOPILOT_CHAT_CONTEXT_CHARS }}
          GATEWAY_SERVICE: ${{ vars.AUTOPILOT_CHAT_GATEWAY_SERVICE || 'repo-autopilot-ai-gateway' }}
        # Every setting comes from repository variables: a deploy replaces the Worker's variables, so
        # values typed into the Cloudflare dashboard would be lost. Secrets ship with the same version.
        run: |
          if [ "$MODEL_PROVIDER" = "openai-compatible" ] && [ -z "$MODEL" ]; then
            echo "::error::AUTOPILOT_CHAT_MODEL_PROVIDER is set; also set AUTOPILOT_CHAT_MODEL to the provider's model name."
            exit 1
          fi
          config=worker/wrangler.jsonc
          # Blablador through the AI gateway: bind its ChatGateway entrypoint (same Cloudflare account) only
          # when selected, so the chat deploys without the gateway otherwise. No provider key is involved.
          if [ "$MODEL_PROVIDER" = "ai-gateway" ]; then
            if ! [[ "$GATEWAY_SERVICE" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]]; then
              echo "::error::AUTOPILOT_CHAT_GATEWAY_SERVICE must be a Worker name such as repo-autopilot-ai-gateway."
              exit 1
            fi
            config=worker/wrangler.gateway.json
            node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync("worker/wrangler.jsonc","utf8").replace(/^\s*\/\/.*$/gm,""));c.services=[{binding:"AI_GATEWAY",service:process.argv[1],entrypoint:"ChatGateway"}];fs.writeFileSync("worker/wrangler.gateway.json",JSON.stringify(c,null,2))' "$GATEWAY_SERVICE"
          fi
          # The dashboard shows which commit is live and since when.
          args=(--config "$config" --var "DEPLOYED_COMMIT:$GITHUB_SHA" --var "DEPLOYED_AT:$(date -u +%Y-%m-%dT%H:%M:%SZ)" --var "REPOSITORY:$REPOSITORY" --var "AUTOPILOT_USER:$OWNER" --var "GITHUB_CLIENT_ID:$CLIENT_ID")
          for name in MODEL MODEL_PROVIDER MODEL_BASE_URL CONTEXT_CHARS; do
            if [ -n "${!name}" ]; then args+=(--var "$name:${!name}"); fi
          done
          umask 077
          secrets="$RUNNER_TEMP/chat-secrets.json"
          node -e 'const s={GITHUB_CLIENT_SECRET:process.env.CLIENT_SECRET};for(const n of ["MODEL_API_KEY","WEBHOOK_SECRET"]) if(process.env[n]) s[n]=process.env[n];require("fs").writeFileSync(process.argv[1],JSON.stringify(s))' "$secrets"
          trap 'rm -f "$secrets"' EXIT
          npx --yes "wrangler@$WRANGLER_VERSION" deploy "${args[@]}" --secrets-file "$secrets"
